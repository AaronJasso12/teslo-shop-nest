name: Reset Demo Database

on:
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

jobs:
  reset-database:
    runs-on: ubuntu-latest

    steps:
      - name: Reset demo database
        run: |
          curl --fail --silent --show-error \
            --request GET \
            --header "x-seed-secret: ${{ secrets.RESET_API_SECRET }}" \
            "${{ secrets.RESET_API_URL }}"